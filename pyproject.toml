[project]
name = "hatyai-floodlens"
version = "1.0.0"
description = "ระบบเฝ้าระวังและพยากรณ์ระดับน้ำในพื้นที่หาดใหญ่ด้วย AI จากข้อมูลอนุกรมเวลาและภาพกล้อง"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "minio>=7.2.5",
    "boto3>=1.34.0",
    "redis>=5.0.3",
    "arq>=0.25.0",
    "requests>=2.31.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "mlflow-skinny>=2.11.0",
    "label-studio-sdk>=0.0.34",
    "pillow>=10.2.0",
    "numpy==1.26.4",
    "pandas>=2.2.1,<3",
    "hatyai-timeseries",
    "opencv-python-headless>=4.8,<4.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
hatyai-timeseries = { path = "TimeSeries-Integration", editable = true }
