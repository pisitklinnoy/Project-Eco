[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hatyai-timeseries"
version = "0.1.0"
description = "Standalone Hatyai water-level inference with saved Random Forest v2 models"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "pandas>=2.1,<3", "scikit-learn==1.4.2", "joblib>=1.3,<2", "tzdata>=2024.1"]

[tool.setuptools.packages.find]
include = ["hatyai_timeseries*"]

[tool.setuptools.package-data]
hatyai_timeseries = ["models/*.joblib", "models/*.json"]
