services:
  # -------------------------------------------------------------
  # 1. Message Queue & In-Memory Store
  # -------------------------------------------------------------
  redis:
    image: redis:8.8.0-alpine
    container_name: floodlens_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Relational Database (PostgreSQL)
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: floodlens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-hatyai_flood_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # -------------------------------------------------------------
  # 3. Object Storage (MinIO)
  # -------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: floodlens_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  # -------------------------------------------------------------
  # 4. MLOps Experiment Tracking & Model Registry (MLflow)
  # -------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: floodlens_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
    depends_on:
      - postgres
      - minio
    command: >
      sh -c "pip install psycopg2-binary boto3 && mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-hatyai_flood_db}
      --default-artifact-root s3://flood-models/
      --host 0.0.0.0
      --port 5000"

  # -------------------------------------------------------------
  # 5. Human-in-the-Loop Annotation & Review (Label Studio)
  # -------------------------------------------------------------
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: floodlens_label_studio
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      - postgres
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=${POSTGRES_DB:-hatyai_flood_db}
      - POSTGRE_USER=${POSTGRES_USER:-admin}
      - POSTGRE_PASSWORD=${POSTGRES_PASSWORD:-password123}
      - POSTGRE_HOST=postgres
      - POSTGRE_PORT=5432
      - LABEL_STUDIO_USERNAME=admin@example.com
      - LABEL_STUDIO_PASSWORD=password123
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data
      - SSRF_PROTECTION_ENABLED=false
    volumes:
      - label-studio-data:/label-studio/data

  # -------------------------------------------------------------
  # 6. FastAPI Backend REST APIs
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: floodlens_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
      - POSTGRES_DB=${POSTGRES_DB:-hatyai_flood_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - ENABLE_OTEL=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - FORECAST_MAX_AGE_MINUTES=${FORECAST_MAX_AGE_MINUTES:-120}
      - FORECAST_MODEL_FAMILY=${FORECAST_MODEL_FAMILY:-delta}
    volumes:
      - ./backend:/app
      - ./time_series_ecosystem:/time_series_ecosystem
      - ./TimeSeries-Integration:/opt/TimeSeries-Integration
      - ./workers:/workers
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - postgres
      - redis
      - minio
      - mlflow

  # -------------------------------------------------------------
  # 7. Background Workers (Ingestion, Vision, Forecast, Alert)
  # -------------------------------------------------------------
  workers:
    build:
      context: ./workers
      dockerfile: Dockerfile.worker
    container_name: floodlens_workers
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
      - POSTGRES_DB=${POSTGRES_DB:-hatyai_flood_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      - LINE_TARGET_USER_OR_GROUP_ID=${LINE_TARGET_USER_OR_GROUP_ID:-}
      - BACKEND_API_URL=http://backend:8000
      - FORECAST_MODEL_FAMILY=${FORECAST_MODEL_FAMILY:-delta}
    volumes:
      - ./workers:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - redis
      - postgres
      - minio
      - mlflow

  # -------------------------------------------------------------
  # 8. Observability Stack (Prometheus, Loki, Tempo, Grafana)
  # -------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.4.0
    container_name: floodlens_tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: floodlens_otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:latest
    container_name: floodlens_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  loki:
    image: grafana/loki:2.9.4
    container_name: floodlens_loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.4
    container_name: floodlens_promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: floodlens_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: floodlens_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  redis-data:
  postgres-data:
  minio-data:
  label-studio-data:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
