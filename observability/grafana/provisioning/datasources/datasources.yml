apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: 'Loki'
        spanStartTimeShift: '1m'
        spanEndTimeShift: '1m'
        filterByTraceId: false
        filterBySpanId: false
        customQuery: true
        query: '{container=~"floodlens_backend|floodlens_workers"} |= "$${__span.traceId}"'
